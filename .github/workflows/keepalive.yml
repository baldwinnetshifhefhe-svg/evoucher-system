name: keep-alive
# Pings the live sites every ~12 minutes so Render's free tier doesn't sleep (avoids the slow first load).
on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping live services
        run: |
          curl -fsS -m 40 "https://evoucher-system-ioj1.onrender.com/" -o /dev/null || true
          curl -fsS -m 40 "https://evoucher-csharp.onrender.com/" -o /dev/null || true
          echo "pinged both e-Voucher services"
